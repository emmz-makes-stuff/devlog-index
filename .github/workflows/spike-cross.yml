# THROWAWAY spike for add-release-workflow §1. Delete before the section commit.
name: spike-cross

on:
  push:
    branches: [change/add-release-workflow]
    paths: [.github/workflows/spike-cross.yml]

permissions:
  contents: read

jobs:
  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build all four targets
        run: |
          zig version
          fail=0
          for t in x86_64-linux aarch64-linux x86_64-windows aarch64-macos; do
            echo "::group::$t"
            start=$SECONDS
            if zig build -Doptimize=ReleaseFast -Dtarget="$t" --prefix "out/$t"; then
              echo "RESULT $t OK in $((SECONDS - start))s"
              ls -l "out/$t/bin"
              file out/$t/bin/*
            else
              echo "RESULT $t FAILED in $((SECONDS - start))s"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "::group::summary"
          for t in x86_64-linux aarch64-linux x86_64-windows aarch64-macos; do
            echo "== $t"; file out/$t/bin/* 2>&1 || echo "no binary"
          done
          echo "::endgroup::"
          exit $fail

      - name: Smoke test linux-x64
        run: out/x86_64-linux/bin/devlog-index --help | head -3
