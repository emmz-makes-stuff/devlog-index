name: release

on:
  push:
    tags: ["v*"]
  # Builds and uploads the archives as workflow artifacts; never publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Same checks as ci.yml: a tag may be pushed on a commit CI never saw.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Format
        run: zig fmt --check src build.zig

      - name: Test
        run: zig build test --summary all

      - name: Release scripts
        run: scripts/test-release-scripts.sh

  # The suite runs natively on Windows: the release binary is cross-built on Linux, so this is the
  # only place its Windows-specific code is exercised.
  check-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig 0.16.0
        shell: pwsh
        run: |
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile zig.zip
          $hash = (Get-FileHash zig.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") { throw "zig.zip sha256 mismatch: $hash" }
          Expand-Archive zig.zip -DestinationPath .
          "$PWD\zig-x86_64-windows-0.16.0" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Test
        shell: pwsh
        run: zig build test --summary all

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          # Exact key only: a release must not build on a cache from another configuration.
          key: zig-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon') }}

      - name: Build and package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; else version="dev-${GITHUB_SHA::7}"; fi
          echo "version=$version"
          # release name : zig target
          for pair in macos-arm64:aarch64-macos linux-x64:x86_64-linux linux-arm64:aarch64-linux windows-x64:x86_64-windows; do
            name=${pair%%:*}
            target=${pair##*:}
            echo "::group::$name ($target)"
            zig build -Doptimize=ReleaseFast -Dtarget="$target" --prefix "out/$name"
            file "out/$name/bin/"devlog-index*
            scripts/package-release.sh "$version" "$name" "out/$name"
            echo "::endgroup::"
          done
          scripts/checksums.sh dist
          cat dist/SHA256SUMS

      # The one target this runner can execute; windows-x64 is smoked on its own runner below, the
      # macOS and arm64 builds are only checked to link.
      - name: Smoke test linux-x64
        run: |
          help=$(out/linux-x64/bin/devlog-index --help 2>&1) || true
          echo "$help" | head -3
          grep -q '^Usage: devlog-index' <<<"$help"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Runs the cross-built release binary itself, from the archive that would be published.
  smoke-windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Smoke test windows-x64
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/devlog-index-*-windows-x64.zip
          if ($zip.Count -ne 1) { throw "expected one windows-x64 zip, found $($zip.Count)" }
          Expand-Archive $zip[0].FullName -DestinationPath out
          $help = (& .\out\devlog-index.exe --help 2>&1 | Out-String)
          $help
          if ($help -notmatch "(?m)^Usage: devlog-index") { throw "unexpected --help output" }

  publish:
    # Only a tag push publishes; a manual dispatch stops after `build`, even one started on a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, check-windows, build, smoke-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); else prerelease=(); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes ${prerelease[@]+"${prerelease[@]}"}
