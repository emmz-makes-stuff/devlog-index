name: release

on:
  push:
    tags: ["v*"]
  # Builds and uploads the archives as workflow artifacts; never publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig 0.16.0
        run: |
          curl -sSfL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-0.16.0-

      - name: Build and package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; else version="dev-${GITHUB_SHA::7}"; fi
          echo "version=$version"
          # release name : zig target
          for pair in macos-arm64:aarch64-macos linux-x64:x86_64-linux linux-arm64:aarch64-linux; do
            name=${pair%%:*}
            target=${pair##*:}
            echo "::group::$name ($target)"
            zig build -Doptimize=ReleaseFast -Dtarget="$target" --prefix "out/$name"
            file "out/$name/bin/devlog-index"
            scripts/package-release.sh "$version" "$name" "out/$name"
            echo "::endgroup::"
          done
          scripts/checksums.sh dist
          cat dist/SHA256SUMS

      # The only target the runner can execute; the others are checked by format only.
      - name: Smoke test linux-x64
        run: |
          help=$(out/linux-x64/bin/devlog-index --help 2>&1) || true
          echo "$help" | head -3
          grep -q '^Usage: devlog-index' <<<"$help"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    # Only a tag push publishes; a manual dispatch stops after `build`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
